name: phpstan

on:
  push:
    branches: [ '5.x' ]
  pull_request:
    types:
      - opened
      - ready_for_review
      - reopened
      - synchronize
  schedule:
    - cron: '0 0 * * *'

jobs:
  moonshine-analyse:
    runs-on: ubuntu-latest

    env:
      COMPOSER_ROOT_VERSION: 5.x-dev

    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2
          coverage: none
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: composer install --dev

      - name: Execute
        run: composer test:types

      - name: Packages
        run: composer test:types:packages

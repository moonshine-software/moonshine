name: mutate-tests

on:
  push:
    branches: [ '5.x' ]
  pull_request:
    types:
      - opened
      - ready_for_review
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: read

jobs:
  moonshine-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      COMPOSER_ROOT_VERSION: 5.x-dev

    strategy:
      fail-fast: true
      matrix:
        php: [8.4]
        laravel: [13]

    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: pcov
      - uses: actions/checkout@v4

      - name: Set up MySQL
        env:
          DB_USERNAME: root
          DB_PASSWORD: root
          DB_DATABASE: moonshine_tests
        run: |
          sudo /etc/init.d/mysql start
          mysql -e 'CREATE DATABASE ${{ env.DB_DATABASE }};' -u${{ env.DB_USERNAME }} -p${{ env.DB_PASSWORD }}
      - name: Copy phpunit.xml.dist
        run: php -r "file_exists('phpunit.xml.dist') || copy('phpunit-example.xml.dist', 'phpunit.xml.dist');"

      - name: Install Dependencies
        run: |
          composer require --dev "laravel/framework:^${{ matrix.laravel }}" --no-update --no-interaction
          composer update --no-interaction --prefer-dist --optimize-autoloader

      - name: Execute mutation tests
        env:
          DB_PASSWORD: root
        run: composer test:mutation

name: Trigger Documentation Generation

on:
  pull_request:
    types: [closed]
    branches:
      - 4.x

# Security: Restrict permissions to minimum required
permissions:
  contents: read
  pull-requests: write

jobs:
  trigger-docs:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        id: diff
        run: |
          # Get the diff of the merged PR
          DIFF=$(git diff "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}")

          # Save to file to avoid issues with special characters
          echo "$DIFF" > pr_diff.txt

          # Security: Limit diff size to 5MB to avoid GitHub API payload limits
          FILE_SIZE=$(stat -f%z pr_diff.txt 2>/dev/null || stat -c%s pr_diff.txt 2>/dev/null || echo 0)
          MAX_SIZE=$((5 * 1024 * 1024))
          if [ "$FILE_SIZE" -gt "$MAX_SIZE" ]; then
            echo "Warning: Diff too large ($FILE_SIZE bytes), truncating to ${MAX_SIZE} bytes"
            dd if=pr_diff.txt of=pr_diff_truncated.txt bs=1 count=$MAX_SIZE 2>/dev/null
            mv pr_diff_truncated.txt pr_diff.txt
          fi

          # Create a base64 encoded version for safe transport
          # Support both GNU (Linux) and BSD (macOS) base64
          DIFF_B64=$(base64 -w 0 pr_diff.txt 2>/dev/null || base64 -i pr_diff.txt)
          echo "diff_b64=$DIFF_B64" >> $GITHUB_OUTPUT

      - name: Trigger doc repo workflow
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.DOC_REPO_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/moonshine-software/doc/dispatches \
            -d '{
              "event_type": "moonshine_pr_merged",
              "client_payload": {
                "pr_url": ${{ toJSON(github.event.pull_request.html_url) }},
                "pr_number": ${{ toJSON(github.event.pull_request.number) }},
                "pr_title": ${{ toJSON(github.event.pull_request.title) }},
                "pr_diff": ${{ toJSON(steps.diff.outputs.diff_b64) }},
                "merged_by": ${{ toJSON(github.event.pull_request.merged_by.login) }}
              }
            }'

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '📚 Documentation generation triggered in [doc repo](https://github.com/moonshine-software/doc/actions)'
            })
